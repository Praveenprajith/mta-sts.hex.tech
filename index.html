<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Verification</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f3f4f6;
    }
    .card {
      background: #fff;
      padding: 40px 50px;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
    }
    h2 { font-size: 22px; color: #111; margin-bottom: 12px; }
    p  { font-size: 14px; color: #6b7280; margin-bottom: 28px; }
    a.btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 13px 36px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }
    a.btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Security Notice</h2>
    <p>Please verify your account to continue to the secure portal.</p>
    <a class="btn" href="csrf.html">Click Here</a>
  </div>
</body>
</html>
